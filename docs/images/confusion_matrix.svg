<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <linearGradient id="bg-cm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="700" height="500" fill="url(#bg-cm)" rx="10"/>
  <rect width="698" height="498" x="1" y="1" fill="none" stroke="#334155" stroke-width="1.5" rx="9"/>

  <!-- Title & Subtitle -->
  <text x="350" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    ResNet-50 Test Set Confusion Matrix (N = 1,311 Scans)
  </text>
  <text x="350" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
    Multi-Class Brain Tumor Classification • Overall Accuracy: 98.40%
  </text>

  <!-- Axis Labels -->
  <text x="420" y="95" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PREDICTED CLASS</text>
  <text x="30" y="270" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90, 30, 270)">TRUE CLASS</text>

  <!-- Column Header Labels -->
  <g font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">
    <text x="235" y="125">Glioma</text>
    <text x="355" y="125">Meningioma</text>
    <text x="475" y="125">Pituitary</text>
    <text x="595" y="125">No Tumor</text>
  </g>

  <!-- Row Header Labels -->
  <g font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="end">
    <text x="165" y="180">Glioma</text>
    <text x="165" y="255">Meningioma</text>
    <text x="165" y="330">Pituitary</text>
    <text x="165" y="405">No Tumor</text>
  </g>

  <!-- 4x4 Grid Matrix Cells -->
  <!-- Row 1: Glioma (Total 300) -->
  <!-- (0,0) Glioma -> Glioma: 294 (98.0%) -->
  <rect x="175" y="145" width="118" height="70" rx="4" fill="#0284c7" fill-opacity="0.85" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="234" y="178" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">294</text>
  <text x="234" y="198" fill="#e0f2fe" font-family="sans-serif" font-size="11" text-anchor="middle">98.0%</text>

  <!-- (0,1) Glioma -> Meningioma: 4 -->
  <rect x="295" y="145" width="118" height="70" rx="4" fill="#1e293b" fill-opacity="0.7"/>
  <text x="354" y="184" fill="#94a3b8" font-family="monospace" font-size="15" text-anchor="middle">4</text>

  <!-- (0,2) Glioma -> Pituitary: 1 -->
  <rect x="415" y="145" width="118" height="70" rx="4" fill="#1e293b" fill-opacity="0.7"/>
  <text x="474" y="184" fill="#94a3b8" font-family="monospace" font-size="15" text-anchor="middle">1</text>

  <!-- (0,3) Glioma -> No Tumor: 1 -->
  <rect x="535" y="145" width="118" height="70" rx="4" fill="#1e293b" fill-opacity="0.7"/>
  <text x="594" y="184" fill="#94a3b8" font-family="monospace" font-size="15" text-anchor="middle">1</text>

  <!-- Row 2: Meningioma (Total 306) -->
  <!-- (1,0) Meningioma -> Glioma: 5 -->
  <rect x="175" y="217" width="118" height="70" rx="4" fill="#1e293b" fill-opacity="0.7"/>
  <text x="234" y="256" fill="#94a3b8" font-family="monospace" font-size="15" text-anchor="middle">5</text>

  <!-- (1,1) Meningioma -> Meningioma: 298 (97.4%) -->
  <rect x="295" y="217" width="118" height="70" rx="4" fill="#0284c7" fill-opacity="0.85" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="354" y="250" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">298</text>
  <text x="354" y="270" fill="#e0f2fe" font-family="sans-serif" font-size="11" text-anchor="middle">97.4%</text>

  <!-- (1,2) Meningioma -> Pituitary: 2 -->
  <rect x="415" y="217" width="118" height="70" rx="4" fill="#1e293b" fill-opacity="0.7"/>
  <text x="474" y="256" fill="#94a3b8" font-family="monospace" font-size="15" text-anchor="middle">2</text>

  <!-- (1,3) Meningioma -> No Tumor: 1 -->
  <rect x="535" y="217" width="118" height="70" rx="4" fill="#1e293b" fill-opacity="0.7"/>
  <text x="594" y="256" fill="#94a3b8" font-family="monospace" font-size="15" text-anchor="middle">1</text>

  <!-- Row 3: Pituitary (Total 300) -->
  <!-- (2,0) Pituitary -> Glioma: 0 -->
  <rect x="175" y="289" width="118" height="70" rx="4" fill="#0f172a" fill-opacity="0.5"/>
  <text x="234" y="328" fill="#475569" font-family="monospace" font-size="15" text-anchor="middle">0</text>

  <!-- (2,1) Pituitary -> Meningioma: 3 -->
  <rect x="295" y="289" width="118" height="70" rx="4" fill="#1e293b" fill-opacity="0.7"/>
  <text x="354" y="328" fill="#94a3b8" font-family="monospace" font-size="15" text-anchor="middle">3</text>

  <!-- (2,2) Pituitary -> Pituitary: 297 (99.0%) -->
  <rect x="415" y="289" width="118" height="70" rx="4" fill="#0284c7" fill-opacity="0.9" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="474" y="322" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">297</text>
  <text x="474" y="342" fill="#e0f2fe" font-family="sans-serif" font-size="11" text-anchor="middle">99.0%</text>

  <!-- (2,3) Pituitary -> No Tumor: 0 -->
  <rect x="535" y="289" width="118" height="70" rx="4" fill="#0f172a" fill-opacity="0.5"/>
  <text x="594" y="328" fill="#475569" font-family="monospace" font-size="15" text-anchor="middle">0</text>

  <!-- Row 4: No Tumor (Total 405) -->
  <!-- (3,0) No Tumor -> Glioma: 2 -->
  <rect x="175" y="361" width="118" height="70" rx="4" fill="#1e293b" fill-opacity="0.7"/>
  <text x="234" y="400" fill="#94a3b8" font-family="monospace" font-size="15" text-anchor="middle">2</text>

  <!-- (3,1) No Tumor -> Meningioma: 1 -->
  <rect x="295" y="361" width="118" height="70" rx="4" fill="#1e293b" fill-opacity="0.7"/>
  <text x="354" y="400" fill="#94a3b8" font-family="monospace" font-size="15" text-anchor="middle">1</text>

  <!-- (3,2) No Tumor -> Pituitary: 1 -->
  <rect x="415" y="361" width="118" height="70" rx="4" fill="#1e293b" fill-opacity="0.7"/>
  <text x="474" y="400" fill="#94a3b8" font-family="monospace" font-size="15" text-anchor="middle">1</text>

  <!-- (3,3) No Tumor -> No Tumor: 401 (99.0%) -->
  <rect x="535" y="361" width="118" height="70" rx="4" fill="#0284c7" fill-opacity="0.95" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="594" y="394" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">401</text>
  <text x="594" y="414" fill="#e0f2fe" font-family="sans-serif" font-size="11" text-anchor="middle">99.0%</text>

  <!-- Bottom Legend Footer -->
  <g transform="translate(175, 450)">
    <rect width="18" height="12" fill="#0284c7" rx="2"/>
    <text x="25" y="10" fill="#94a3b8" font-family="sans-serif" font-size="11">Diagonal: True Class Detections</text>
    <rect x="230" width="18" height="12" fill="#1e293b" rx="2"/>
    <text x="255" y="10" fill="#94a3b8" font-family="sans-serif" font-size="11">Off-Diagonal: Classification Errors</text>
    <text x="450" y="10" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">F1-Score: 0.984</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <linearGradient id="bg-roc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="700" height="500" fill="url(#bg-roc)" rx="10"/>
  <rect width="698" height="498" x="1" y="1" fill="none" stroke="#334155" stroke-width="1.5" rx="9"/>

  <!-- Title & Subtitle -->
  <text x="350" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Multi-Class Receiver Operating Characteristic (ROC)
  </text>
  <text x="350" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
    One-vs-Rest (OvR) Evaluation Across 4 Brain Tissue Classes (Mean AUC = 0.996)
  </text>

  <!-- Graph Plot Area (Origin: 90, 390; Width: 380, Height: 300) -->
  <g transform="translate(90, 90)">
    <!-- Plot Background -->
    <rect width="380" height="300" fill="#030712" stroke="#334155" stroke-width="1"/>

    <!-- Grid Lines (Every 20%) -->
    <g stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2">
      <!-- Horizontals (TPR) -->
      <line x1="0" y1="240" x2="380" y2="240"/>
      <line x1="0" y1="180" x2="380" y2="180"/>
      <line x1="0" y1="120" x2="380" y2="120"/>
      <line x1="0" y1="60" x2="380" y2="60"/>
      <line x1="0" y1="0" x2="380" y2="0"/>
      <!-- Verticals (FPR) -->
      <line x1="76" y1="0" x2="76" y2="300"/>
      <line x1="152" y1="0" x2="152" y2="300"/>
      <line x1="228" y1="0" x2="228" y2="300"/>
      <line x1="304" y1="0" x2="304" y2="300"/>
      <line x1="380" y1="0" x2="380" y2="300"/>
    </g>

    <!-- Chance Baseline (Diagonal) -->
    <line x1="0" y1="300" x2="380" y2="0" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- ROC Curve 1: Normal (Healthy) - AUC 0.999 -->
    <!-- (0,0) -> (0.01, 0.98) -> (0.04, 0.995) -> (1, 1) -->
    <path d="M 0 300 L 4 10 L 15 3 L 76 1 L 380 0" fill="none" stroke="#10b981" stroke-width="2.5"/>

    <!-- ROC Curve 2: Pituitary - AUC 0.998 -->
    <!-- (0,0) -> (0.015, 0.97) -> (0.05, 0.99) -> (1, 1) -->
    <path d="M 0 300 L 6 15 L 20 5 L 100 2 L 380 0" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- ROC Curve 3: Glioma - AUC 0.994 -->
    <!-- (0,0) -> (0.025, 0.94) -> (0.08, 0.98) -> (1, 1) -->
    <path d="M 0 300 L 10 25 L 30 10 L 120 4 L 380 0" fill="none" stroke="#a855f7" stroke-width="2.5"/>

    <!-- ROC Curve 4: Meningioma - AUC 0.991 -->
    <!-- (0,0) -> (0.035, 0.92) -> (0.10, 0.97) -> (1, 1) -->
    <path d="M 0 300 L 14 35 L 42 15 L 140 6 L 380 0" fill="none" stroke="#f59e0b" stroke-width="2.5"/>

    <!-- Axis Ticks & Labels -->
    <!-- X-Axis (FPR) -->
    <text x="0" y="318" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">0.0</text>
    <text x="76" y="318" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">0.2</text>
    <text x="152" y="318" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">0.4</text>
    <text x="228" y="318" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">0.6</text>
    <text x="304" y="318" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">0.8</text>
    <text x="380" y="318" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">1.0</text>
    <text x="190" y="340" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">False Positive Rate (1 - Specificity)</text>

    <!-- Y-Axis (TPR) -->
    <text x="-10" y="304" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">0.0</text>
    <text x="-10" y="244" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">0.2</text>
    <text x="-10" y="184" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">0.4</text>
    <text x="-10" y="124" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">0.6</text>
    <text x="-10" y="64" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">0.8</text>
    <text x="-10" y="5" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">1.0</text>
    <text x="-45" y="150" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle" transform="rotate(-90, -45, 150)">True Positive Rate (Sensitivity)</text>
  </g>

  <!-- Legend Card on the Right -->
  <g transform="translate(495, 110)">
    <rect width="185" height="260" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="28" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">CLASS AUC SCORES</text>

    <!-- Pituitary -->
    <circle cx="22" cy="62" r="5" fill="#38bdf8"/>
    <text x="36" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Pituitary</text>
    <text x="36" y="74" fill="#38bdf8" font-family="monospace" font-size="11">AUC = 0.998</text>

    <!-- Normal -->
    <circle cx="22" cy="107" r="5" fill="#10b981"/>
    <text x="36" y="103" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">No Tumor</text>
    <text x="36" y="119" fill="#10b981" font-family="monospace" font-size="11">AUC = 0.999</text>

    <!-- Glioma -->
    <circle cx="22" cy="152" r="5" fill="#a855f7"/>
    <text x="36" y="148" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Glioma</text>
    <text x="36" y="164" fill="#a855f7" font-family="monospace" font-size="11">AUC = 0.994</text>

    <!-- Meningioma -->
    <circle cx="22" cy="197" r="5" fill="#f59e0b"/>
    <text x="36" y="193" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Meningioma</text>
    <text x="36" y="209" fill="#f59e0b" font-family="monospace" font-size="11">AUC = 0.991</text>

    <!-- Random Line -->
    <line x1="15" y1="237" x2="30" y2="237" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="36" y="241" fill="#64748b" font-family="sans-serif" font-size="11">Chance (AUC = 0.50)</text>
  </g>
</svg>
